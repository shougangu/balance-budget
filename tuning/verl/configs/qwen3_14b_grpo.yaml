# ABOUTME: verl overrides for the 14B long-CoT GRPO worker (merged over ppo_trainer defaults).
# ABOUTME: Batch geometry knobs are starting points; smoke #5 throughput calibration fixes them.

data:
  train_files: tuning/data/datasets/verl/rlvr-dapo.train.parquet
  val_files: tuning/data/datasets/verl/rlvr-dapo.test.parquet
  train_batch_size: 64          # prompts per rollout step (x rollout.n sequences)
  max_prompt_length: 2048
  max_response_length: 32768    # cap sits above the SFT length distribution
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    use_remove_padding: true
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 32
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 36864   # >= max_prompt_length + max_response_length
    loss_agg_mode: token-mean
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28              # DAPO clip-higher
    use_kl_loss: false
    entropy_coeff: 0.0
    optim:
      lr: 1.0e-6
    fsdp_config:
      param_offload: true              # colocate: free HBM for vLLM during rollout
      optimizer_offload: true
  rollout:
    name: vllm
    n: 8
    tensor_model_parallel_size: 2      # 14B@32k: TP=2 trades ~10-15% token latency for +50% KV
    gpu_memory_utilization: 0.75
    temperature: 1.0

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

reward:
  # verl 0.9.0 reads the reward function from here; the legacy top-level
  # custom_reward_function block is only migrated on the v1 trainer path.
  custom_reward_function:
    path: tuning/verl/reward.py
    name: compute_score
  # DAPO soft overlong punishment: a response inside the last `len` tokens of
  # the cap loses up to penalty_factor, so a truncated answer is not graded
  # like a confidently wrong one (length collapse guard).
  reward_manager:
    name: dapo
  reward_kwargs:
    max_resp_len: 32768
    overlong_buffer_cfg:
      enable: true
      len: 4096
      penalty_factor: 1.0
      log: true

trainer:
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: 20                        # resume cadence; budget marks bank independently
  max_actor_ckpt_to_keep: 2
